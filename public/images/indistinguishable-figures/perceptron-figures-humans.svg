<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Helvetica, Arial, sans-serif">
  <title>How to defeat a human (or a multimodal LLM)</title>
  <desc>Four visual tasks that defeat fast human perception and/or multimodal LLMs.
  Panel 1: simultaneous lightness contrast — two identical #8A8A8A squares on dark and
  light fields look different. Panel 2: the Ebbinghaus illusion — two identical discs
  look different sizes because of surrounding context circles. Panel 3: adversarial
  numerosity — the cloud with fewer dots has 2.4x the ink, fooling human number sense;
  exact counting is also a reliable MLLM failure. Panel 4: three same-colored tangled
  paths with 14 crossings — deciding which letter connects to which number requires
  serial tracing (Ullman's visual routines), a documented blind spot of current MLLMs
  and the direct descendant of the perceptron's connectedness problem. Companion to
  perceptron-figures.svg and perceptron-figures-more.svg.</desc>

  <rect width="900" height="720" fill="#fdfcf7"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1c1c1c">How to defeat a human (or a multimodal LLM)</text>
  <text x="450" y="54" text-anchor="middle" font-size="12.5" fill="#5a5a5a">Perceptrons aren&#8217;t special: every fast visual system buys speed with blind spots.</text>

  <!-- ================= Panel 1: simultaneous contrast ================= -->
  <text x="235" y="94" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1c1c1c">1 &#183; Are the two small squares the same color?</text>
  <rect x="70" y="115" width="160" height="150" fill="#2b2b2b"/>
  <rect x="240" y="115" width="160" height="150" fill="#e6e2d8"/>
  <rect x="127" y="167" width="46" height="46" fill="#8a8a8a"/>
  <rect x="297" y="167" width="46" height="46" fill="#8a8a8a"/>
  <text x="235" y="322" text-anchor="middle" font-size="11.5" fill="#5a5a5a">Yes &#8212; both are #8A8A8A. Lightness is computed relative to the surround,</text>
  <text x="235" y="338" text-anchor="middle" font-size="11.5" fill="#5a5a5a">so the patch on the dark field looks lighter. A feature that is locally</text>
  <text x="235" y="354" text-anchor="middle" font-size="11.5" fill="#5a5a5a">identical is perceived as different &#8212; the inverse of the perceptron&#8217;s flaw.</text>

  <!-- ================= Panel 2: Ebbinghaus ================= -->
  <text x="665" y="94" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1c1c1c">2 &#183; Which rust disc is larger?</text>
  <g fill="#a5a29a">
    <circle cx="627" cy="195" r="27"/><circle cx="601" cy="240" r="27"/><circle cx="549" cy="240" r="27"/>
    <circle cx="523" cy="195" r="27"/><circle cx="549" cy="150" r="27"/><circle cx="601" cy="150" r="27"/>
  </g>
  <circle cx="575" cy="195" r="15" fill="#b3452c"/>
  <g fill="#a5a29a">
    <circle cx="783" cy="195" r="6.5"/><circle cx="774.8" cy="214.8" r="6.5"/><circle cx="755" cy="223" r="6.5"/>
    <circle cx="735.2" cy="214.8" r="6.5"/><circle cx="727" cy="195" r="6.5"/><circle cx="735.2" cy="175.2" r="6.5"/>
    <circle cx="755" cy="167" r="6.5"/><circle cx="774.8" cy="175.2" r="6.5"/>
  </g>
  <circle cx="755" cy="195" r="15" fill="#b3452c"/>
  <text x="665" y="322" text-anchor="middle" font-size="11.5" fill="#5a5a5a">Neither: both have radius 15. The Ebbinghaus illusion &#8212; surrounding context</text>
  <text x="665" y="338" text-anchor="middle" font-size="11.5" fill="#5a5a5a">rescales perceived size. Any vision system that judges size by pooling</text>
  <text x="665" y="354" text-anchor="middle" font-size="11.5" fill="#5a5a5a">neighborhood contrast inherits the error; a ruler does not.</text>

  <!-- ================= Panel 3: adversarial numerosity ================= -->
  <text x="235" y="414" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1c1c1c">3 &#183; Which cloud has more dots?</text>
  <rect x="55" y="435" width="160" height="155" fill="none" stroke="#d8d5cc" stroke-width="1.5"/>
  <rect x="255" y="435" width="160" height="155" fill="none" stroke="#d8d5cc" stroke-width="1.5"/>
  <g fill="#16324f">
    <circle cx="111.6" cy="467.8" r="7.5"/><circle cx="155.1" cy="457.8" r="7.5"/><circle cx="139.8" cy="495.3" r="7.5"/><circle cx="76.2" cy="513.5" r="7.5"/><circle cx="77.8" cy="460.1" r="7.5"/><circle cx="125.0" cy="554.3" r="7.5"/><circle cx="151.9" cy="569.8" r="7.5"/><circle cx="198.3" cy="454.5" r="7.5"/><circle cx="182.7" cy="485.6" r="7.5"/><circle cx="159.0" cy="503.2" r="7.5"/><circle cx="110.3" cy="523.5" r="7.5"/><circle cx="174.2" cy="538.0" r="7.5"/><circle cx="73.7" cy="534.0" r="7.5"/><circle cx="180.2" cy="569.4" r="7.5"/><circle cx="131.6" cy="533.5" r="7.5"/><circle cx="85.7" cy="480.2" r="7.5"/>
  </g>
  <g fill="#16324f">
    <circle cx="328.4" cy="520.5" r="4.2"/><circle cx="394.2" cy="507.9" r="4.2"/><circle cx="291.0" cy="514.1" r="4.2"/><circle cx="353.1" cy="551.9" r="4.2"/><circle cx="278.3" cy="486.0" r="4.2"/><circle cx="277.9" cy="554.2" r="4.2"/><circle cx="362.0" cy="450.8" r="4.2"/><circle cx="402.3" cy="575.1" r="4.2"/><circle cx="356.5" cy="528.1" r="4.2"/><circle cx="287.2" cy="447.2" r="4.2"/><circle cx="339.0" cy="453.2" r="4.2"/><circle cx="291.8" cy="477.8" r="4.2"/><circle cx="269.4" cy="507.6" r="4.2"/><circle cx="326.7" cy="558.6" r="4.2"/><circle cx="337.7" cy="531.4" r="4.2"/><circle cx="329.0" cy="482.6" r="4.2"/><circle cx="382.5" cy="540.5" r="4.2"/><circle cx="309.2" cy="476.1" r="4.2"/><circle cx="305.5" cy="454.7" r="4.2"/><circle cx="372.2" cy="499.1" r="4.2"/><circle cx="398.9" cy="559.2" r="4.2"/>
  </g>
  <text x="235" y="640" text-anchor="middle" font-size="11.5" fill="#5a5a5a">The right one: 21 dots vs 16 &#8212; but the left cloud has 2.4&#215; the ink, and human</text>
  <text x="235" y="656" text-anchor="middle" font-size="11.5" fill="#5a5a5a">number sense estimates from area and density, not count. Exact counting</text>
  <text x="235" y="672" text-anchor="middle" font-size="11.5" fill="#5a5a5a">defeats fast perception &#8212; and remains a reliable failure mode of MLLMs.</text>

  <!-- ================= Panel 4: trace the tangled paths ================= -->
  <text x="665" y="414" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1c1c1c">4 &#183; Which letter connects to which number?</text>
  <g fill="none" stroke="#16324f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500.0 450.0L503.9 455.9L507.8 460.0L511.6 463.3L515.5 465.8L519.4 467.1L523.2 467.3L527.1 466.3L531.0 464.1L534.9 460.8L538.8 456.7L542.6 452.1L546.5 447.2L550.4 442.6L554.2 438.5L558.1 435.3L562.0 433.3L565.9 432.8L569.8 433.9L573.6 436.7L577.5 441.1L581.4 447.0L585.2 454.2L589.1 462.3L593.0 470.9L596.9 479.7L600.8 488.1L604.6 495.8L608.5 502.3L612.4 507.2L616.2 510.4L620.1 511.5L624.0 510.7L627.9 507.8L631.8 503.2L635.6 497.0L639.5 489.7L643.4 481.6L647.2 473.3L651.1 465.2L655.0 457.9L658.9 451.7L662.8 447.0L666.6 444.2L670.5 443.4L674.4 444.7L678.2 448.0L682.1 453.2L686.0 460.0L689.9 468.1L693.8 477.0L697.6 486.4L701.5 495.6L705.4 504.3L709.2 512.0L713.1 518.4L717.0 523.2L720.9 526.2L724.8 527.4L728.6 526.8L732.5 524.5L736.4 520.9L740.2 516.1L744.1 510.5L748.0 504.7L751.9 498.8L755.8 493.5L759.6 488.9L763.5 485.3L767.4 483.1L771.2 482.1L775.1 482.5L779.0 484.2L782.9 487.0L786.8 490.6L790.6 494.8L794.5 499.2L798.4 503.3L802.2 506.9L806.1 509.5L810.0 510.0"/>
    <path d="M500.0 510.0L503.9 515.3L507.8 515.5L511.6 513.3L515.5 509.3L519.4 504.2L523.2 498.9L527.1 494.1L531.0 490.7L534.9 489.4L538.8 490.5L542.6 494.4L546.5 500.8L550.4 509.6L554.2 520.0L558.1 531.2L562.0 542.3L565.9 552.2L569.8 560.1L573.6 565.1L577.5 566.7L581.4 564.7L585.2 559.1L589.1 550.4L593.0 539.3L596.9 526.9L600.8 514.2L604.6 502.4L608.5 492.6L612.4 486.0L616.2 483.1L620.1 484.3L624.0 489.8L627.9 499.1L631.8 511.6L635.6 526.3L639.5 541.9L643.4 557.2L647.2 571.0L651.1 582.0L655.0 589.5L658.9 592.7L662.8 591.6L666.6 586.2L670.5 577.1L674.4 565.2L678.2 551.7L682.1 537.7L686.0 524.5L689.9 513.3L693.8 505.2L697.6 500.8L701.5 500.5L705.4 504.3L709.2 511.9L713.1 522.5L717.0 535.2L720.9 548.9L724.8 562.5L728.6 574.8L732.5 584.9L736.4 592.0L740.2 595.8L744.1 596.1L748.0 593.1L751.9 587.4L755.8 579.7L759.6 570.9L763.5 562.0L767.4 553.8L771.2 547.2L775.1 542.7L779.0 540.7L782.9 541.2L786.8 544.0L790.6 548.5L794.5 554.2L798.4 560.1L802.2 565.5L806.1 569.4L810.0 570.0"/>
    <path d="M500.0 570.0L503.9 563.1L507.8 558.3L511.6 555.1L515.5 554.0L519.4 555.1L523.2 558.3L527.1 563.0L531.0 568.2L534.9 573.0L538.8 576.3L542.6 577.2L546.5 575.1L550.4 569.7L554.2 561.4L558.1 551.0L562.0 539.4L565.9 528.0L569.8 518.1L573.6 511.0L577.5 507.6L581.4 508.2L585.2 512.9L589.1 520.8L593.0 531.0L596.9 542.0L600.8 552.2L604.6 560.0L608.5 564.2L612.4 564.0L616.2 559.1L620.1 549.8L624.0 537.1L627.9 522.3L631.8 507.1L635.6 493.2L639.5 482.3L643.4 475.5L647.2 473.5L651.1 476.5L655.0 483.9L658.9 494.5L662.8 506.8L666.6 519.1L670.5 529.6L674.4 536.9L678.2 539.8L682.1 537.9L686.0 531.2L689.9 520.5L693.8 507.0L697.6 492.2L701.5 477.9L705.4 465.6L709.2 456.7L713.1 452.0L717.0 451.7L720.9 455.6L724.8 462.9L728.6 472.3L732.5 482.4L736.4 491.6L740.2 498.7L744.1 502.7L748.0 503.0L751.9 499.6L755.8 493.0L759.6 484.1L763.5 473.9L767.4 463.8L771.2 454.9L775.1 448.0L779.0 443.8L782.9 442.2L786.8 443.1L790.6 445.7L794.5 449.1L798.4 452.3L802.2 454.3L806.1 454.3L810.0 450.0"/>
  </g>
  <g fill="#16324f">
    <circle cx="500" cy="450" r="4.5"/><circle cx="500" cy="510" r="4.5"/><circle cx="500" cy="570" r="4.5"/>
    <circle cx="810" cy="450" r="4.5"/><circle cx="810" cy="510" r="4.5"/><circle cx="810" cy="570" r="4.5"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#1c1c1c">
    <text x="487" y="455" text-anchor="end">A</text>
    <text x="487" y="515" text-anchor="end">B</text>
    <text x="487" y="575" text-anchor="end">C</text>
    <text x="823" y="455">1</text>
    <text x="823" y="515">2</text>
    <text x="823" y="575">3</text>
  </g>
  <text x="665" y="632" text-anchor="middle" font-size="11.5" fill="#5a5a5a">A&#8594;2, B&#8594;3, C&#8594;1, through 14 crossings of three same-colored paths. No local</text>
  <text x="665" y="648" text-anchor="middle" font-size="11.5" fill="#5a5a5a">window tells you; the answer requires serial tracing (Ullman&#8217;s &#8220;visual routines&#8221;).</text>
  <text x="665" y="664" text-anchor="middle" font-size="11.5" fill="#5a5a5a">Path-tracing is a documented blind spot of current MLLMs (&#8220;Vision Language</text>
  <text x="665" y="680" text-anchor="middle" font-size="11.5" fill="#5a5a5a">Models Are Blind,&#8221; 2024) &#8212; the perceptron&#8217;s connectedness problem, still with us.</text>
</svg>
